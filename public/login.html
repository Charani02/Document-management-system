
<!DOCTYPE html>
<html lang="en">
<head>

<body>

<div class="form-container">
    <h1>📁 Charani DMS</h1>
    <h2>Login</h2>

    <form id="loginForm">

        <input type="password" id="password" placeholder="Password" required>

        <button type="submit" class="btn">Login</button>

    <p id="message"></p>

    </p>

    <a href="index.html">Back to Home</a>
